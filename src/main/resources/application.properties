spring.application.name=VentasPost
server.port=${PORT:8080}

# ==========================================
# SESIONES HTTP (Stateful + Cookie HttpOnly)
# Expiracion por inactividad: 4 horas
# Multiples sesiones activas permitidas
# ==========================================
server.servlet.session.timeout=4h
server.servlet.session.cookie.name=VENTASPOST_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ==========================================
# BASE DE DATOS MYSQL & ZONA HORARIA (UTC-3)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ventaspost_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY MIGRATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# JACKSON / JSON
# ==========================================
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
